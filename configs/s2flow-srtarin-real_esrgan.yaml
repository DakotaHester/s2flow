job:
  name: s2flow_realesrgan
  type: sr_train
  log_dir: ./logs
  out_dir: ./runs
  load_checkpoint: False

data:
  samples_par_path: ./data/s2flow-s2naip/samples.par
  data_dir_path: ./data/s2flow-s2naip
  augmentations: spatial
  num_workers: 8
  pin_memory: True

# Generator
sr_model:
  model_type: rrdbnet
  in_channels: 4
  out_channels: 4
  num_feat: 64
  num_block: 23
  num_growth: 32
  scale: 4

# Discriminator 
discriminator_model:
  model_type: unet_sn
  in_channels: 4
  num_feat: 64
  skip_connection: True

# Hyperparameters (Real-ESRGAN settings)
hyperparameters:
  learning_rate_generator: 1.0e-4
  learning_rate_discriminator: 1.0e-4
  weight_decay: 0.01
  batch_size: 32       
  micro_batch_size: 16
  num_epochs: 100      
  warmup_epochs: 10
  use_amp: True

loss_weights:
  pix: 1.0
  percep: 1.0
  gan: 0.1

metrics:
  pca_lpips_clamp: True
  pca_lpips_k: 3.0

sampling:
  gan: true